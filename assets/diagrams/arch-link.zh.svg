<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 123" width="1190" height="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" role="img">
<style>
