name: CI

# 触发时机:push 到 main,以及任何 PR
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. 把代码 checkout 到这台干净虚拟机
      - uses: actions/checkout@v4

      # 2. 装 uv(带缓存,后续跑更快)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3. 装项目要求的 Python
      - name: Set up Python 3.12
        run: uv python install 3.12

      # 4. 装依赖(含 dev 组的 pytest)
      - name: Install dependencies
        run: uv sync

      # 5. 跑测试
      - name: Run tests
        run: uv run pytest -q
