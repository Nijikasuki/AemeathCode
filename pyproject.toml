[project]
name = "aemeathcode"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.120.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
]

# 命令行入口:装包后生成 `aemeath` 命令,指向 cli/main.py 的 main()
[project.scripts]
aemeath = "aemeathcode.cli.main:main"

# 构建后端:让本项目能被当成一个可安装的包(src 布局)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 告诉 hatchling 包的源码在 src/aemeathcode 下
[tool.hatch.build.targets.wheel]
packages = ["src/aemeathcode"]

# sdist 默认会把仓库里没被 .gitignore 的文件全打进去 —— assets/ 里的 GIF 有 4.3MB,
# 那是 README 在 GitHub 上的门面,装包的人一个字节都用不到。排掉。
[tool.hatch.build.targets.sdist]
exclude = ["assets"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"     # async 测试函数自动当 asyncio 跑,不用每个都 @pytest.mark.asyncio
testpaths = ["tests"]     # 从这里递归找 test_*.py
